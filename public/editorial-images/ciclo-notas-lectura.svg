<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">Ciclo de una nota de lectura</title><desc id="desc">Preguntar, leer, resumir y volver al texto.</desc>
<rect width="960" height="470" rx="28" fill="#ede6d8"/><text x="56" y="68" fill="#463c31" font-family="Georgia,serif" font-size="26">La nota abre un camino de regreso</text>
<g font-family="Arial,sans-serif"><circle cx="230" cy="235" r="94" fill="#183f38"/><text x="172" y="226" fill="#dac592" font-size="17">01</text><text x="172" y="260" fill="#ffffff" font-size="25" font-family="Georgia,serif">Preguntar</text><circle cx="480" cy="235" r="94" fill="#9b5d3f"/><text x="422" y="226" fill="#f9dfaa" font-size="17">02</text><text x="425" y="260" fill="#ffffff" font-size="25" font-family="Georgia,serif">Leer</text><circle cx="730" cy="235" r="94" fill="#3b3958"/><text x="672" y="226" fill="#e3d3a0" font-size="17">03</text><text x="664" y="260" fill="#ffffff" font-size="25" font-family="Georgia,serif">Resumir</text><path d="M315 235h65 M565 235h65" stroke="#9b8e7a" stroke-width="4" stroke-linecap="round"/><path d="M715 340 C500 420 250 410 180 335" fill="none" stroke="#9b8e7a" stroke-width="4" stroke-linecap="round"/><path d="M180 335l-4 17 17-5" fill="#9b8e7a"/><text x="286" y="407" fill="#5c5144" font-size="17">volver al pasaje que todavía no puedes explicar</text></g>
</svg>
